<!doctype html>
<html lang="zh-CN" class="startup-splash-active">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0d" />
    <title>热量快查</title>
    <script>
      // 在应用脚本加载前恢复上次主题，避免主页首帧主题跳变。
      try {
        const startupTheme = localStorage.getItem("app-theme-v1");
        if (startupTheme === "light" || startupTheme === "dark") {
          document.documentElement.dataset.theme = startupTheme;
          document.documentElement.style.colorScheme = startupTheme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
